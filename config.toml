enable-magisk-update = false   # set this to false if you do not want to receive updates for the module in magisk app

# add 'enabled = false' for not patching a specific app or remove it from the config
# see https://github.com/j-hc/revanced-magisk-module/blob/main/CONFIG.md for more detailed explanations

# you can use rvmm-config-gen to generate a config

[TikTok]
# De-Vanced has no tiktok patches at all; icysymmetra is where 'SIM spoof' lives
patches-source = "icysymmetra/tiktok-patches-for-morphe"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "IcySymmetra"
build-mode = "apk"
arch = "all"
apkmirror-dlurl = "https://www.apkmirror.com/apk/tiktok-pte-ltd/tik-tok-including-musical-ly/"
uptodown-dlurl = "https://tiktok.en.uptodown.com/android"
apkcombo-dlurl = "https://apkcombo.com/tiktok/com.zhiliaoapp.musically"
gplay-dlurl = "com.zhiliaoapp.musically"
included-patches = "'SIM spoof' 'Hide floating promotions'"

[TikTok-NexAlloy]
app-name = "TikTok"
patcher = "lspatch"
module-source = "gnadgnaoh/SexAlloy"
module-version = "v1.0"
rv-brand = "NexAlloy"
build-mode = "apk"
arch = "all"
# the module hooks at runtime, so it rides on whatever version a mirror has
version = "latest"
apkmirror-dlurl = "https://www.apkmirror.com/apk/tiktok-pte-ltd/tik-tok-including-musical-ly/"
uptodown-dlurl = "https://tiktok.en.uptodown.com/android"
apkcombo-dlurl = "https://apkcombo.com/tiktok/com.zhiliaoapp.musically"
gplay-dlurl = "com.zhiliaoapp.musically"